<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PhiChart Editor · 开始</title>
    <link rel="stylesheet" href="start.css" />
  </head>
  <body class="st">
    <header class="st-head">
      <div class="st-brand">
        <div class="st-logo">φ</div>
        <div>
          <h1>PhiChart Editor</h1>
          <p class="dim" id="st-subtitle">正在加载…</p>
        </div>
      </div>

      <!-- 文档在 GitHub 仓库中维护：开始页只给入口，不内嵌副本 -->
      <nav class="st-links" aria-label="文档">
        <a class="st-link" id="st-doc-charter"
          href="https://github.com/Stry114/PhiChart-Editor/blob/main/docs/%E8%B0%B1%E5%B8%88%E6%96%87%E6%A1%A3.md"
          target="_blank" rel="noopener" title="使用指南">谱师文档</a>
        <a class="st-link" id="st-doc-phigros"
          href="https://github.com/Stry114/PhiChart-Editor/blob/main/docs/Phigros%E6%96%87%E6%A1%A3.md"
          target="_blank" rel="noopener" title="谱面格式文档">Phigros 文档</a>
        <a class="st-link" id="st-doc-project"
          href="https://github.com/Stry114/PhiChart-Editor/blob/main/docs/%E9%A1%B9%E7%9B%AE%E6%96%87%E6%A1%A3.md"
          target="_blank" rel="noopener" title="开发文档">项目文档</a>
      </nav>
    </header>

    <main class="st-main">
      <!-- 只留两个入口：编辑器 / 播放器。打开谱面包、新建项目等都在编辑器内完成 -->
      <section class="st-cards st-choices">
        <a class="st-card st-card-big" href="edit.html" id="st-editor" title="制谱">
          <span class="st-card-ico" data-icon="editor_icon" data-icon-size="30"></span>
          <span class="st-card-title">编辑器</span>
          <span class="st-card-desc">打开谱面包，或新建项目</span>
        </a>

        <a class="st-card st-card-big" href="player.html" id="st-player" title="播放谱面">
          <span class="st-card-ico" data-icon="player_icon" data-icon-size="30"></span>
          <span class="st-card-title">播放器</span>
          <span class="st-card-desc">载入谱面包，自动游玩并计分</span>
        </a>
      </section>
    </main>

    <script type="module" src="src/start/main.js"></script>
  </body>
</html>
