<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>PhiChart Editor · 渲染器 v1</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="boot">
      正在加载渲染器…
      <br />
      <span class="dim">首次打开需要下载脚本、贴图与字体（约 3.5 MB；字体已裁剪成子集，只有 0.2 MB），之后走缓存、秒开</span>
    </div>

    <!-- 舞台占满整个画面：开始播放后没有任何侧边栏（所有设置都在暂停页里） -->
    <main id="stage-wrap">
      <canvas id="stage"></canvas>

      <div id="hud">
        <!-- 顶部进度条：5px、白色 50% 半透明；已播部分为不透明白（见 styles.css 的 #hud-progress） -->
        <div id="hud-progress"><div id="hud-progress-fill"></div></div>

        <!-- 左上角：暂停键（只有一个白色图标，无底色无边框） -->
        <button id="btn-pause" class="hud-icon" type="button" title="暂停（Esc / 空格）"></button>

        <!-- 正上方：连击数（大）+ 状态小字（只在连击数显示时出现；文案可配置，见 main.js 的 hudLabels） -->
        <div id="hud-combo-wrap">
          <div id="hud-combo"></div>
          <div id="hud-combo-label"></div>
        </div>

        <!-- 右上角：分数 -->
        <div id="hud-score">0000000</div>

        <!-- 左下角：曲名；右下角：难度 -->
        <div id="hud-name"></div>
        <div id="hud-level"></div>
      </div>

      <!-- 暂停页：黑色半透明全屏遮罩，主层只有一排图标按钮；设置与载入各为一层二级页面 -->
      <div id="pause-screen" class="screen">
        <div class="pause-panel">
          <div class="pause-head">
            <button id="pause-back" class="pause-back hidden" type="button" title="返回"></button>
          </div>

          <!-- 主层：打开 / 重开 / 自动游玩 / 全屏 / 设置 / 继续（暂停页不显示任何文字） -->
          <div id="pause-main" class="pause-page">
            <div class="pause-actions">
              <button id="btn-open" class="pause-icon" type="button" title="打开谱面"></button>
              <button id="btn-restart" class="pause-icon" type="button" title="重开"></button>
              <button id="btn-autoplay" class="pause-icon" type="button" title="自动游玩"></button>
              <button id="btn-fullscreen-main" class="pause-icon" type="button" title="全屏"></button>
              <button id="btn-settings" class="pause-icon" type="button" title="设置"></button>
              <button id="btn-play" class="pause-icon" type="button" title="继续"></button>
            </div>
          </div>

          <!-- 二级页面：设置（移动端风格：图标 + 名称 + 右侧控件，触控目标 ≥ 44px） -->
          <div id="pause-settings" class="pause-page hidden">
            <div class="set-card">
              <div class="set-row">
                <span class="set-ic" data-ic="hand"></span>
                <label class="set-name" for="play-mode">触屏游玩</label>
                <input id="play-mode" class="switch" type="checkbox" />
              </div>
              <div id="play-mode-hint" class="set-hint dim hidden"></div>
              <div class="set-row">
                <span class="set-ic" data-ic="adsorption_x"></span>
                <span class="set-name">判定范围</span>
                <div class="seg" role="group">
                  <button id="judge-band" class="chip active" type="button">垂直</button>
                  <button id="judge-tilt" class="chip" type="button">轨道</button>
                  <button id="judge-screen" class="chip" type="button">全屏</button>
                </div>
              </div>
              <div class="set-row">
                <span class="set-ic" data-ic="assistant"></span>
                <label class="set-name" for="multi-hint">多押提示</label>
                <input id="multi-hint" class="switch" type="checkbox" checked />
              </div>
              <div class="set-row">
                <span class="set-ic" data-ic="layer"></span>
                <label class="set-name" for="show-lines">判定线</label>
                <input id="show-lines" class="switch" type="checkbox" checked />
              </div>
              <div class="set-row">
                <span class="set-ic" data-ic="note"></span>
                <label class="set-name" for="show-notes">音符</label>
                <input id="show-notes" class="switch" type="checkbox" checked />
              </div>
              <div class="set-row">
                <span class="set-ic" data-ic="speed"></span>
                <label class="set-name" for="low-perf">低性能模式</label>
                <input id="low-perf" class="switch" type="checkbox" />
              </div>
              <div class="set-row">
                <span class="set-ic" data-ic="scale"></span>
                <span class="set-name">音符宽度</span>
                <div class="stepper">
                  <button id="btn-note-narrow" class="step" type="button">−</button>
                  <span id="note-width" class="tag">1.00×</span>
                  <button id="btn-note-wide" class="step" type="button">＋</button>
                </div>
              </div>
              <div class="set-row">
                <span class="set-ic" data-ic="fast_forward"></span>
                <span class="set-name">倍速</span>
                <div class="stepper">
                  <button id="btn-rate-down" class="step" type="button">−</button>
                  <button id="btn-rate" class="chip step-value" type="button" title="点击回到 1.00×">1.00×</button>
                  <button id="btn-rate-up" class="step" type="button">＋</button>
                </div>
              </div>
              <div class="set-row">
                <span class="set-ic" data-ic="fullscreen"></span>
                <span class="set-name">全屏</span>
                <button id="btn-fullscreen" class="chip step-chip" type="button">切换</button>
              </div>
              <div class="set-row set-progress">
                <span class="set-ic" data-ic="to_the_end"></span>
                <span class="set-name">进度</span>
                <input id="progress" type="range" min="0" max="100" value="0" step="0.1" />
              </div>
              <div class="set-row set-debug">
                <span class="set-name dim">调试</span>
                <label class="check"><input id="show-judge-range" type="checkbox" /> 判定范围</label>
                <label class="check"><input id="show-fingers" type="checkbox" /> 手指位置</label>
              </div>
            </div>
          </div>

          <!-- 二级页面：打开谱面（与编辑器开屏一致：文件夹包 / zip 包；同样是图标按钮） -->
          <div id="pause-open" class="pause-page hidden">
            <div class="pause-actions pause-actions-open">
              <button id="btn-open-folder" class="pause-icon" type="button" title="打开文件夹包"></button>
              <button id="btn-open-zip" class="pause-icon" type="button" title="打开 zip 谱包"></button>
            </div>
            <div class="pause-open-alt">
              <button id="btn-open-json" class="pause-link" type="button">只选谱面 JSON</button>
            </div>
            <div id="pause-open-status" class="pause-hint dim">可拖入文件</div>
            <input id="file-input" type="file" webkitdirectory multiple class="hidden" />
            <input id="zip-input" type="file" accept=".zip" class="hidden" />
            <input id="json-input" type="file" accept=".json,application/json" class="hidden" />
          </div>
        </div>
      </div>

      <!-- 结算 -->
      <div id="play-result" class="screen hidden">
        <div class="screen-box center">
          <div id="play-result-text"></div>
          <div class="actions">
            <button id="btn-again" class="action primary" type="button">再来一次</button>
            <button id="btn-back" class="action" type="button">返回</button>
          </div>
        </div>
      </div>
    </main>

    <script type="module" src="src/app/main.js"></script>
  </body>
</html>
